<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101b25" />
  <title>SlimeOps — Control Room</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="AppShell">
    <header class="AppHeader"><div class="Brand"><i></i><span>SLIMEOPS<br>CONTROL ROOM</span></div><div class="ApiStatus" id="apiStatus">● API DEMO</div></header>
    <section class="TopControls">
      <article class="Panel ControlPanel"><div class="PanelTitle">CONTROL DEL AGENTE</div><div class="ControlFields"><label>AGENTE<select id="agentSelect"></select></label><label>MÁX. TOKENS<input id="budgetInput" type="number" min="500" max="24000" step="500" /></label></div><div class="EffortSelector" id="effortSelector"></div><button class="PrimaryButton" id="saveControls" type="button">GUARDAR AJUSTES</button></article>
      <article class="Panel MetricsPanel"><div class="PanelTitle">SALUD OPERATIVA</div><div class="MetricGrid"><div><span>USO</span><b id="budgetUsage">—</b></div><div><span>MARGEN</span><b id="budgetMargin">—</b></div><div><span>ACTIVOS</span><b id="activeAgents">—</b></div><div><span>ESTADO</span><b id="budgetHealth">—</b></div></div><div class="BudgetBar"><i id="budgetBar"></i></div><div class="MetricFoot"><span id="budgetNumbers">—</span><span id="efficiencyMessage">—</span></div></article>
      <article class="Panel ActivityPanel"><div class="PanelTitle">ACTIVIDAD</div><div class="ActivityList" id="activityLog"></div></article>
    </section>
    <section class="SlimeRoom" id="slimeRoom">
      <div class="RoomHeader"><span>SALA EN DIRECTO</span><small id="roomStatus">En espera</small></div>
      <i class="RoomWindow Left"></i><i class="RoomWindow Right"></i><i class="RoomRug"></i><i class="RoomPlant"></i>
      <i class="Bed Director"></i><i class="Bed Nexus"></i><i class="Bed Scout"></i><i class="Bed Forge"></i><i class="Bed Sentinel"></i>
      <i class="Desk Director"></i><i class="Desk Nexus"></i><i class="Desk Scout"></i><i class="Desk Forge"></i><i class="Desk Sentinel"></i>
      <form class="MissionPopup" id="missionForm"><label for="missionInput">NUEVA MISIÓN</label><div><input id="missionInput" required autocomplete="off" placeholder="Escribe una orden…" /><button>ENVIAR</button></div><small id="missionSummary">Los slimes descansan.</small></form>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
